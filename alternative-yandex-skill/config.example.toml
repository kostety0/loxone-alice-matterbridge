[loxone]
# IP-адрес Miniserver'а в домашней сети
host = "192.168.1.77"
# Отдельный пользователь Loxone (создайте в Loxone Config)
user = "alice"
password = "ПАРОЛЬ_ПОЛЬЗОВАТЕЛЯ_LOXONE"

# Какие устройства отдавать в Алису (имя или id из `--list`).
# Пустой include = все поддерживаемые (выключатели, диммеры, жалюзи).
include = []
exclude = []

[server]
listen_host = "127.0.0.1"
listen_port = 8090

[oauth]
# Эти значения нужно вписать в настройки навыка в Яндекс Диалогах.
client_id = "loxone-alice"
client_secret = "ЗАМЕНИТЕ_НА_ДЛИННУЮ_СЛУЧАЙНУЮ_СТРОКУ"
# Пароль, который вы один раз введёте при привязке навыка в приложении «Дом с Алисой»
password = "ПАРОЛЬ_ДЛЯ_ПРИВЯЗКИ"
